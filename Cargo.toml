[workspace]
members = [
    "backend/db",
    "backend/models",
    "backend/controller",
    "backend/auth",
    "backend/rbac",
    "backend/routes",
    "backend/gateway",
    "backend/search",
    "backend/storage",
    "crates/maps",
    "crates/fleet-icons",
    "crates/gateway-fleet",
    "crates/beem-africa",
    "crates/clickpesa",
    "crates/notifty",
]
exclude = [
    "vendor/applewallet",
    "vendor/h3o",
    "vendor/fleet",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
db = { path = "backend/db", default-features = false }
models = { path = "backend/models", default-features = false }
controller = { path = "backend/controller", default-features = false }
auth = { path = "backend/auth" }
routes = { path = "backend/routes", default-features = false }
rbac = { path = "backend/rbac", default-features = false }
maps = { path = "crates/maps", default-features = false }
storage = { path = "backend/storage", default-features = false }
search = { path = "backend/search", default-features = false }
fleet-icons = { path = "crates/fleet-icons", default-features = false }
gateway-fleet = { path = "crates/gateway-fleet", default-features = false }
beem-africa = { path = "crates/beem-africa" }
clickpesa = { path = "crates/clickpesa" }
notifty = { path = "crates/notifty" }
applewallet = { path = "vendor/applewallet" }
fleet = { path = "vendor/fleet", default-features = false, features = ["geometry"] }

tantivy = "0.22"

diesel = { version = "2.1", default-features = false, features = ["chrono", "r2d2", "32-column-tables", "postgres"] }
diesel_migrations = { version = "2.2", default-features = false }
r2d2 = "0.8"
dotenvy = "0.15"

axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "fs"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
argon2 = "0.6"
password-hash = { version = "0.6" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ammonia = "4"
bytes = "1"

rustls = "0.23"
tokio-rustls = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "cookies"] }
sha2 = "0.10"
utoipa = "4"
utoipa-swagger-ui = { version = "7", features = ["axum"] }
